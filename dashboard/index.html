<!DOCTYPE html>
<html>
    <head>
        <title> SYSWATCH </title>
    </head>

    <body>
        <h1> SYSWATCH</h1>
        <h2>Latest Telemetry</h2>

        <div id="telemetry">
            Loading...
        </div>

        <script>
            async function loadTelemetry() {
                const response = await fetch(
                    "http://127.0.0.1:8000/telemetry/latest"
                );

                const data = await response.json();

                document.getElementById("telemetry").innerHTML = `
                    <p>Hostname: ${data.hostname}</p>
                    <p>CPU: ${data.cpu_percent}%</p>
                    <p>Memory: ${data.memory_percent}%</p>
                    <p>Disk: ${data.disk_percent}%</p>
                `;
            }
            loadTelemetry();
        </script>
    </body>
</html>
